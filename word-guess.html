<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Guess</title>
<style>
  :root {
    --bg: #121213;
    --panel: #1a1a1b;
    --border: #3a3a3c;
    --border-active: #565758;
    --text: #ffffff;
    --text-dim: #818384;
    --correct: #538d4e;
    --present: #b59f3b;
    --absent: #3a3a3c;
    --accent: #538d4e;
    --danger: #d64545;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    user-select: none;
  }

  header {
    width: 100%;
    max-width: 500px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 30px;
    letter-spacing: 2px;
    margin: 0;
    font-weight: 700;
  }

  #new-game-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-active);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  #new-game-btn:hover { background: var(--border); }

  #stats {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 14px;
    margin-bottom: 14px;
  }
  #stats span b { color: var(--text); }

  #message {
    min-height: 22px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    padding: 6px 14px;
    border-radius: 4px;
    background: var(--panel);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  #message.show { opacity: 1; }
  #message.win { color: var(--correct); }
  #message.lose { color: var(--danger); }

  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 22px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 52px);
    gap: 6px;
  }

  .tile {
    width: 52px;
    height: 52px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    text-transform: uppercase;
    background: transparent;
    transition: transform 0.12s ease;
  }

  .tile.filled { border-color: var(--border-active); }
  .tile.pop { animation: pop 0.1s ease; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .row.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }

  .tile.flip {
    animation: flip 0.5s ease forwards;
  }
  @keyframes flip {
    0% { transform: rotateX(0deg); }
    50% { transform: rotateX(90deg); }
    51% { border-color: transparent; }
    100% { transform: rotateX(0deg); }
  }

  .tile.correct { background: var(--correct); border-color: var(--correct); }
  .tile.present { background: var(--present); border-color: var(--present); }
  .tile.absent { background: var(--absent); border-color: var(--absent); }

  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 500px;
  }

  .krow {
    display: flex;
    justify-content: center;
    gap: 6px;
  }

  .key {
    background: #818384;
    color: var(--text);
    border: none;
    border-radius: 4px;
    padding: 0;
    height: 46px;
    min-width: 32px;
    flex: 1;
    max-width: 42px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .key:hover { filter: brightness(1.15); }
  .key.wide { max-width: 62px; font-size: 11px; }

  .key.correct { background: var(--correct); }
  .key.present { background: var(--present); }
  .key.absent { background: var(--absent); color: #6f6f70; }

  footer {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    max-width: 500px;
  }

  @media (max-width: 380px) {
    .tile { width: 44px; height: 44px; font-size: 22px; }
    .row { grid-template-columns: repeat(5, 44px); }
  }
</style>
</head>
<body>

<header>
  <h1>Word Guess</h1>
  <button id="new-game-btn">New Game</button>
</header>

<div id="stats">
  <span>Streak: <b id="streak">0</b></span>
  <span>Played: <b id="played">0</b></span>
  <span>Wins: <b id="wins">0</b></span>
</div>

<div id="message"></div>

<div id="board"></div>

<div id="keyboard"></div>

<footer>Guess the 5-letter word in 6 tries. Green = right spot, yellow = wrong spot, gray = not in the word.</footer>

<script>
(function () {
  "use strict";

  const WORDS = [
    "about","above","actor","acute","admit","adopt","adult","after","again","agent",
    "agree","ahead","alarm","album","alert","alike","alive","allow","alone","along",
    "alter","among","angel","anger","angle","angry","apart","apple","apply","arena",
    "argue","arise","armor","aside","asset","audio","audit","avoid","awake","award",
    "aware","badly","baker","basic","basis","beach","began","begin","being","below",
    "bench","birth","black","blade","blame","blank","blast","blend","blind","block",
    "blood","board","boost","booth","bound","brain","brand","brave","bread","break",
    "breed","brief","bring","broad","broke","brown","brush","build","built","burst",
    "cabin","cable","calm","carry","catch","cause","chain","chair","chalk","champ",
    "chaos","charm","chart","chase","cheap","check","cheer","chess","chief","child",
    "chill","china","choir","chose","civil","claim","class","clean","clear","clerk",
    "click","cliff","climb","clock","close","cloth","cloud","clown","coach","coast",
    "could","count","court","cover","craft","crash","crazy","cream","crime","crisp",
    "cross","crowd","crown","crude","curve","cycle","daily","dance","dealt","death",
    "debut","delay","depth","diary","dirty","doubt","dozen","draft","drain","drama",
    "drank","dream","dress","drift","drill","drink","drive","drove","dying","eager",
    "early","earth","eight","elite","empty","enemy","enjoy","enter","entry","equal",
    "error","essay","event","every","exact","exist","extra","faith","false","fault",
    "fence","fever","fiber","field","fifth","fifty","fight","final","first","flame",
    "flash","fleet","flesh","float","flock","flood","floor","flour","fluid","focus",
    "force","forge","forth","forty","forum","found","frame","fraud","fresh","front",
    "frost","fruit","fully","funny","gains","games","gauge","gaunt","genre","ghost",
    "giant","given","glass","globe","glory","glove","grace","grade","grain","grand",
    "grant","grape","graph","grasp","grass","great","greed","green","greet","grief",
    "grill","grind","groan","gross","group","grown","guard","guess","guest","guide",
    "habit","happy","harsh","haste","haven","heart","heavy","hobby","honor","horse",
    "hotel","house","human","humor","ideal","image","imply","index","inner","input",
    "issue","ivory","jelly","joint","judge","juice","jumbo","knife","knock","known",
    "label","labor","laser","laugh","layer","learn","least","leave","legal","level",
    "light","limit","linen","lodge","logic","loose","lower","loyal","lucky","lunar",
    "lunch","lying","magic","major","maker","march","match","maybe","mayor","meant",
    "medal","media","merge","merit","metal","meter","might","minor","minus","mixed",
    "model","moist","money","month","moral","motor","mount","mouse","mouth","movie",
    "music","naive","naked","nerve","never","newly","night","noise","north","noted",
    "novel","nurse","occur","ocean","offer","often","olive","onion","opera","orbit",
    "order","organ","other","ought","outer","owner","oxide","paint","panel","panic",
    "paper","party","pause","peace","phase","phone","photo","piano","piece","pilot",
    "pitch","pizza","place","plaid","plain","plane","plant","plate","point","pound",
    "power","press","price","pride","prime","print","prior","prize","proof","proud",
    "prove","pulse","punch","pupil","purse","queen","query","quest","quick","quiet",
    "quite","quota","radar","radio","raise","rally","ranch","range","rapid","ratio",
    "reach","react","ready","realm","rebel","refer","reign","relax","reply","rider",
    "ridge","rifle","rigid","risky","rival","river","roast","robot","rocky","roman",
    "rough","round","route","royal","rugby","rural","sadly","salad","sauce","scale",
    "scare","scene","scent","scope","score","screw","seven","shade","shake","shape",
    "share","shark","sharp","shelf","shell","shift","shine","shirt","shock","shore",
    "short","shout","shown","sight","silly","since","sixth","sixty","skill","sleep",
    "slice","slide","slope","small","smart","smell","smile","smoke","snake","solar",
    "solid","solve","sorry","sound","south","space","spare","spark","speak","speed",
    "spell","spend","spent","spice","spike","spine","split","spoke","sport","spray",
    "squad","stack","staff","stage","stake","stand","stare","start","state","steak",
    "steam","steel","steep","stern","stick","stiff","still","stock","stone","store",
    "storm","story","stove","strip","stuck","study","stuff","style","sugar","suite",
    "sunny","super","sweep","sweet","swift","swing","sword","table","taste","teach",
    "tempo","tenth","thank","theft","their","theme","there","thick","thing","think",
    "third","those","three","threw","throw","thumb","tiger","tight","timer","tired",
    "title","today","token","topic","total","touch","tough","tower","toxic","trace",
    "track","trade","trail","train","trait","trend","trial","tribe","trick","tried",
    "troop","truck","truly","trunk","trust","truth","tumor","turbo","twist","ultra",
    "uncle","under","union","unite","unity","until","upper","upset","urban","usage",
    "usual","valid","value","vapor","vault","venue","verse","video","vinyl","viral",
    "virus","visit","vital","vivid","vocal","voice","waste","watch","water","weary",
    "wedge","weird","wheat","wheel","where","which","while","white","whole","whose",
    "woman","world","worry","worse","worst","worth","would","wound","wrist","write",
    "wrong","yield","young","youth"
  ];

  const WORD_SET = new Set(WORDS);
  const MAX_GUESSES = 6;
  const WORD_LEN = 5;

  const boardEl = document.getElementById("board");
  const keyboardEl = document.getElementById("keyboard");
  const messageEl = document.getElementById("message");
  const newGameBtn = document.getElementById("new-game-btn");
  const streakEl = document.getElementById("streak");
  const playedEl = document.getElementById("played");
  const winsEl = document.getElementById("wins");

  let answer = "";
  let guesses = [];
  let current = "";
  let row = 0;
  let over = false;
  let msgTimer = null;

  let stats = loadStats();

  function loadStats() {
    try {
      const raw = localStorage.getItem("word-guess-stats");
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { streak: 0, played: 0, wins: 0 };
  }

  function saveStats() {
    localStorage.setItem("word-guess-stats", JSON.stringify(stats));
  }

  function renderStats() {
    streakEl.textContent = stats.streak;
    playedEl.textContent = stats.played;
    winsEl.textContent = stats.wins;
  }

  const KEY_ROWS = [
    "qwertyuiop".split(""),
    "asdfghjkl".split(""),
    ["Enter", ..."zxcvbnm".split(""), "Back"]
  ];

  function buildBoard() {
    boardEl.innerHTML = "";
    for (let r = 0; r < MAX_GUESSES; r++) {
      const rowEl = document.createElement("div");
      rowEl.className = "row";
      rowEl.id = "row-" + r;
      for (let c = 0; c < WORD_LEN; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = "tile-" + r + "-" + c;
        rowEl.appendChild(tile);
      }
      boardEl.appendChild(rowEl);
    }
  }

  function buildKeyboard() {
    keyboardEl.innerHTML = "";
    KEY_ROWS.forEach(krow => {
      const krowEl = document.createElement("div");
      krowEl.className = "krow";
      krow.forEach(k => {
        const btn = document.createElement("button");
        btn.className = "key";
        if (k === "Enter" || k === "Back") btn.classList.add("wide");
        btn.textContent = k === "Back" ? "⌫" : (k === "Enter" ? "Enter" : k);
        btn.id = "key-" + k;
        btn.addEventListener("click", () => handleKey(k === "Back" ? "Backspace" : k));
        krowEl.appendChild(btn);
      });
      keyboardEl.appendChild(krowEl);
    });
  }

  function showMessage(text, cls, duration) {
    clearTimeout(msgTimer);
    messageEl.textContent = text;
    messageEl.className = "show" + (cls ? " " + cls : "");
    if (duration) {
      msgTimer = setTimeout(() => {
        messageEl.classList.remove("show");
      }, duration);
    }
  }

  function resetGame() {
    answer = WORDS[Math.floor(Math.random() * WORDS.length)];
    guesses = [];
    current = "";
    row = 0;
    over = false;
    buildBoard();
    buildKeyboard();
    messageEl.className = "";
    messageEl.textContent = "";
  }

  function updateRowDisplay() {
    for (let c = 0; c < WORD_LEN; c++) {
      const tile = document.getElementById("tile-" + row + "-" + c);
      const ch = current[c];
      tile.textContent = ch ? ch.toUpperCase() : "";
      tile.classList.toggle("filled", !!ch);
    }
  }

  function evaluateGuess(guess) {
    const result = new Array(WORD_LEN).fill("absent");
    const answerChars = answer.split("");
    const used = new Array(WORD_LEN).fill(false);

    for (let i = 0; i < WORD_LEN; i++) {
      if (guess[i] === answerChars[i]) {
        result[i] = "correct";
        used[i] = true;
      }
    }
    for (let i = 0; i < WORD_LEN; i++) {
      if (result[i] === "correct") continue;
      const idx = answerChars.findIndex((ch, j) => ch === guess[i] && !used[j]);
      if (idx !== -1) {
        result[i] = "present";
        used[idx] = true;
      }
    }
    return result;
  }

  function applyKeyColor(letter, state) {
    const btn = document.getElementById("key-" + letter);
    if (!btn) return;
    const rank = { absent: 0, present: 1, correct: 2 };
    const currentState = btn.dataset.state;
    if (!currentState || rank[state] > rank[currentState]) {
      btn.classList.remove("correct", "present", "absent");
      btn.classList.add(state);
      btn.dataset.state = state;
    }
  }

  function revealRow(guess, result) {
    for (let c = 0; c < WORD_LEN; c++) {
      const tile = document.getElementById("tile-" + row + "-" + c);
      setTimeout(() => {
        tile.classList.add("flip");
        setTimeout(() => {
          tile.classList.add(result[c]);
        }, 250);
      }, c * 250);
    }
    setTimeout(() => {
      for (let c = 0; c < WORD_LEN; c++) {
        applyKeyColor(guess[c], result[c]);
      }
    }, WORD_LEN * 250);
  }

  function shakeRow() {
    const rowEl = document.getElementById("row-" + row);
    rowEl.classList.add("shake");
    setTimeout(() => rowEl.classList.remove("shake"), 400);
  }

  function endGame(won) {
    over = true;
    stats.played += 1;
    if (won) {
      stats.wins += 1;
      stats.streak += 1;
    } else {
      stats.streak = 0;
    }
    saveStats();
    renderStats();
    const delay = WORD_LEN * 250 + 300;
    setTimeout(() => {
      if (won) {
        showMessage("Nice! You got it in " + (row + 1) + "/" + MAX_GUESSES, "win");
      } else {
        showMessage("Out of guesses. The word was " + answer.toUpperCase() + ".", "lose");
      }
    }, delay);
  }

  function submitGuess() {
    if (current.length !== WORD_LEN) {
      showMessage("Not enough letters", null, 1200);
      shakeRow();
      return;
    }
    if (!WORD_SET.has(current)) {
      showMessage("Not in word list", null, 1200);
      shakeRow();
      return;
    }
    const result = evaluateGuess(current);
    revealRow(current, result);
    guesses.push(current);

    const won = result.every(r => r === "correct");
    if (won) {
      endGame(true);
    } else if (row === MAX_GUESSES - 1) {
      endGame(false);
    } else {
      row += 1;
      current = "";
    }
  }

  function handleKey(key) {
    if (over) return;
    if (key === "Enter") {
      submitGuess();
    } else if (key === "Backspace") {
      current = current.slice(0, -1);
      updateRowDisplay();
    } else if (/^[a-zA-Z]$/.test(key) && current.length < WORD_LEN) {
      current += key.toLowerCase();
      updateRowDisplay();
      const tile = document.getElementById("tile-" + row + "-" + (current.length - 1));
      tile.classList.add("pop");
      setTimeout(() => tile.classList.remove("pop"), 100);
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter") handleKey("Enter");
    else if (e.key === "Backspace") handleKey("Backspace");
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key);
  });

  newGameBtn.addEventListener("click", resetGame);

  renderStats();
  resetGame();
})();
</script>

</body>
</html>
