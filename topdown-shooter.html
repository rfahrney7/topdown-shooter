<title>Top-Down Shooter</title>
<style>
  :root {
    --bg: #10151a;
    --grid-line: rgba(255,255,255,0.04);
    --hud-text: #e9f1f7;
    --health-bg: #2a1414;
    --health-fill: #d63b3b;
    --health-fill-low: #ff2b2b;
    --score-color: #f4d35e;
    --accent: #3b6fd6;
    --font-display: "Trebuchet MS", "Segoe UI", ui-sans-serif, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-mono);
  }

  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    image-rendering: pixelated;
    background: var(--bg);
  }

  .hud {
    position: absolute;
    top: 16px;
    left: 16px;
    color: var(--hud-text);
    pointer-events: none;
    user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }

  .hud .score {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--score-color);
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }

  .health-track {
    width: 200px;
    height: 16px;
    border-radius: 8px;
    background: var(--health-bg);
    border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
  }

  .health-fill {
    height: 100%;
    width: 100%;
    background: var(--health-fill);
    transition: width 0.15s ease, background-color 0.2s ease;
  }

  .hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(233,241,247,0.55);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    transition: opacity 1.2s ease;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10,14,18,0.82);
    color: var(--hud-text);
    text-align: center;
    font-family: var(--font-display);
  }

  .overlay.hidden { display: none; }

  .overlay h1 {
    margin: 0;
    font-size: 2.4rem;
    letter-spacing: 0.04em;
    color: #ff5c5c;
    text-shadow: 0 2px 12px rgba(255,60,60,0.4);
  }

  .overlay .final-score {
    font-size: 1.1rem;
    color: var(--score-color);
    font-family: var(--font-mono);
  }

  .overlay button {
    margin-top: 10px;
    padding: 10px 22px;
    font-size: 1rem;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #10151a;
    background: var(--score-color);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .overlay button:hover { filter: brightness(1.08); }
  .overlay button:active { transform: translateY(1px); }
</style>

<div id="game-wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="score">SCORE: <span id="score-val">0</span></div>
    <div class="health-track"><div class="health-fill" id="health-fill"></div></div>
  </div>

  <div class="hint" id="hint">WASD to move &middot; mouse to aim &middot; click to shoot</div>

  <div class="overlay hidden" id="game-over">
    <h1>YOU DIED</h1>
    <div class="final-score">Final Score: <span id="final-score-val">0</span></div>
    <button id="restart-btn">Click to Restart</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Canvas setup
  // ---------------------------------------------------------------------
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  // ---------------------------------------------------------------------
  // Pixel-art sprite sheet generation
  // ---------------------------------------------------------------------
  var FRAME = 16; // internal pixel-grid resolution per frame

  function pixelCircle(fctx, ox, oy, cx, cy, r, color) {
    fctx.fillStyle = color;
    var r2 = r * r;
    for (var x = -r; x <= r; x++) {
      for (var y = -r; y <= r; y++) {
        if (x * x + y * y <= r2) {
          fctx.fillRect(ox + cx + x, oy + cy + y, 1, 1);
        }
      }
    }
  }

  function pixelDot(fctx, ox, oy, x, y, color) {
    fctx.fillStyle = color;
    fctx.fillRect(ox + x, oy + y, 1, 1);
  }

  function pixelRect(fctx, ox, oy, x, y, w, h, color) {
    fctx.fillStyle = color;
    fctx.fillRect(ox + x, oy + y, w, h);
  }

  // Build a sprite sheet canvas from an array of frame-draw functions.
  function buildSpriteSheet(frameDrawFns) {
    var sheet = document.createElement("canvas");
    sheet.width = FRAME * frameDrawFns.length;
    sheet.height = FRAME;
    var sctx = sheet.getContext("2d");
    sctx.imageSmoothingEnabled = false;
    frameDrawFns.forEach(function (draw, i) {
      draw(sctx, i * FRAME, 0);
    });
    return { canvas: sheet, frameCount: frameDrawFns.length, frameSize: FRAME };
  }

  var CX = 8, CY = 8; // sprite center within a frame

  // --- Player sprite: blob body + head shading + gun barrel, 2-frame bob ---
  function drawPlayerFrame(bodyR, outlineR) {
    return function (fctx, ox, oy) {
      pixelCircle(fctx, ox, oy, CX, CY, outlineR, "#132038");
      pixelCircle(fctx, ox, oy, CX, CY, bodyR, "#3b6fd6");
      pixelCircle(fctx, ox, oy, CX - 1, CY - 1, Math.max(1, bodyR - 2), "#5a8de8");
      pixelCircle(fctx, ox, oy, CX + 1, CY, 2, "#e8b98a");
      // gun barrel pointing along +x (frame's "forward" direction)
      pixelRect(fctx, ox, oy, CX + 4, CY - 1, 5, 3, "#7a7f87");
      pixelRect(fctx, ox, oy, CX + 4, CY - 1, 5, 1, "#9ba1ab");
      pixelDot(fctx, ox, oy, CX + 8, CY, "#2a2c30");
      pixelDot(fctx, ox, oy, CX + 8, CY - 1, "#2a2c30");
    };
  }

  var playerSheet = buildSpriteSheet([
    drawPlayerFrame(5, 6),
    drawPlayerFrame(4, 5)
  ]);

  // --- Enemy sprite: spiky sickly-green blob, 2-frame idle pulse ---
  function drawEnemyFrame(bodyR, outlineR) {
    return function (fctx, ox, oy) {
      var spikeR = outlineR + 1;
      pixelDot(fctx, ox, oy, CX + spikeR, CY, "#233318");
      pixelDot(fctx, ox, oy, CX - spikeR, CY, "#233318");
      pixelDot(fctx, ox, oy, CX, CY + spikeR, "#233318");
      pixelDot(fctx, ox, oy, CX, CY - spikeR, "#233318");
      pixelCircle(fctx, ox, oy, CX, CY, outlineR, "#233318");
      pixelCircle(fctx, ox, oy, CX, CY, bodyR, "#6b8f3c");
      pixelCircle(fctx, ox, oy, CX - 1, CY - 1, Math.max(1, bodyR - 3), "#84ab52");
      pixelDot(fctx, ox, oy, CX + 1, CY - 1, "#1a1a1a");
      pixelDot(fctx, ox, oy, CX + 2, CY - 1, "#1a1a1a");
      pixelDot(fctx, ox, oy, CX + 1, CY + 1, "#1a1a1a");
      pixelDot(fctx, ox, oy, CX + 2, CY + 1, "#1a1a1a");
    };
  }

  var enemySheet = buildSpriteSheet([
    drawEnemyFrame(5, 6),
    drawEnemyFrame(5.6, 6.6)
  ]);

  function drawSprite(sheet, frameIndex, x, y, angle, drawSize, hitFlash) {
    var f = sheet.frameSize;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (hitFlash > 0) {
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(hitFlash * 40);
      ctx.filter = "brightness(2) saturate(0)";
    }
    ctx.drawImage(
      sheet.canvas,
      frameIndex * f, 0, f, f,
      -drawSize / 2, -drawSize / 2, drawSize, drawSize
    );
    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------
  var keys = Object.create(null);
  window.addEventListener("keydown", function (e) {
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener("keyup", function (e) {
    keys[e.key.toLowerCase()] = false;
  });

  var mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };
  canvas.addEventListener("mousemove", function (e) {
    var rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  canvas.addEventListener("mousedown", function (e) {
    if (e.button === 0) mouse.down = true;
  });
  window.addEventListener("mouseup", function (e) {
    if (e.button === 0) mouse.down = false;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------
  var PLAYER_RADIUS = 15;
  var PLAYER_SPEED = 230;
  var PLAYER_MAX_HEALTH = 100;
  var FIRE_INTERVAL = 0.16;
  var BULLET_SPEED = 640;
  var BULLET_RADIUS = 4;
  var BULLET_DAMAGE = 18;
  var BULLET_TTL = 1.4;
  var ENEMY_RADIUS = 15;
  var ENEMY_HEALTH = 40;
  var ENEMY_SPEED_MIN = 65;
  var ENEMY_SPEED_MAX = 115;
  var ENEMY_DAMAGE = 12;
  var ENEMY_CONTACT_COOLDOWN = 0.7;
  var SPAWN_INTERVAL = 1.1;

  var player, bullets, enemies, score, spawnTimer, fireTimer, isGameOver;

  function resetGame() {
    player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      health: PLAYER_MAX_HEALTH,
      aimAngle: 0,
      moving: false,
      animTimer: 0,
      invulnTimer: 0,
      hitFlash: 0
    };
    bullets = [];
    enemies = [];
    score = 0;
    spawnTimer = SPAWN_INTERVAL;
    fireTimer = 0;
    isGameOver = false;
    updateHud();
    document.getElementById("game-over").classList.add("hidden");
  }

  function updateHud() {
    document.getElementById("score-val").textContent = score;
    var pct = Math.max(0, player.health / PLAYER_MAX_HEALTH) * 100;
    var fill = document.getElementById("health-fill");
    fill.style.width = pct + "%";
    fill.style.background = pct <= 30 ? "var(--health-fill-low)" : "var(--health-fill)";
  }

  function spawnEnemy() {
    var margin = 40;
    var side = Math.floor(Math.random() * 4);
    var x, y;
    if (side === 0) { x = -margin; y = Math.random() * canvas.height; }
    else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
    else if (side === 2) { x = Math.random() * canvas.width; y = -margin; }
    else { x = Math.random() * canvas.width; y = canvas.height + margin; }

    enemies.push({
      x: x,
      y: y,
      health: ENEMY_HEALTH,
      speed: ENEMY_SPEED_MIN + Math.random() * (ENEMY_SPEED_MAX - ENEMY_SPEED_MIN),
      animTimer: Math.random() * 10,
      hitFlash: 0,
      angle: 0
    });
  }

  function fireBullet() {
    var gunLen = 20;
    var bx = player.x + Math.cos(player.aimAngle) * gunLen;
    var by = player.y + Math.sin(player.aimAngle) * gunLen;
    bullets.push({
      x: bx,
      y: by,
      vx: Math.cos(player.aimAngle) * BULLET_SPEED,
      vy: Math.sin(player.aimAngle) * BULLET_SPEED,
      ttl: BULLET_TTL
    });
  }

  function triggerGameOver() {
    isGameOver = true;
    document.getElementById("final-score-val").textContent = score;
    document.getElementById("game-over").classList.remove("hidden");
  }

  // ---------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------
  function update(dt) {
    if (isGameOver) return;

    // --- player movement ---
    var dx = 0, dy = 0;
    if (keys["w"] || keys["arrowup"]) dy -= 1;
    if (keys["s"] || keys["arrowdown"]) dy += 1;
    if (keys["a"] || keys["arrowleft"]) dx -= 1;
    if (keys["d"] || keys["arrowright"]) dx += 1;

    player.moving = dx !== 0 || dy !== 0;
    if (player.moving) {
      var len = Math.sqrt(dx * dx + dy * dy);
      player.x += (dx / len) * PLAYER_SPEED * dt;
      player.y += (dy / len) * PLAYER_SPEED * dt;
      player.animTimer += dt;
    }
    player.x = Math.max(PLAYER_RADIUS, Math.min(canvas.width - PLAYER_RADIUS, player.x));
    player.y = Math.max(PLAYER_RADIUS, Math.min(canvas.height - PLAYER_RADIUS, player.y));

    player.aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

    if (player.invulnTimer > 0) player.invulnTimer -= dt;
    if (player.hitFlash > 0) player.hitFlash -= dt;

    // --- firing ---
    fireTimer -= dt;
    if (mouse.down && fireTimer <= 0) {
      fireBullet();
      fireTimer = FIRE_INTERVAL;
    }

    // --- bullets ---
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.ttl -= dt;
      if (b.ttl <= 0 || b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
        bullets.splice(i, 1);
      }
    }

    // --- enemy spawning ---
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = SPAWN_INTERVAL;
    }

    // --- enemies ---
    for (var j = enemies.length - 1; j >= 0; j--) {
      var e = enemies[j];
      var ex = player.x - e.x, ey = player.y - e.y;
      var edist = Math.sqrt(ex * ex + ey * ey) || 1;
      e.angle = Math.atan2(ey, ex);
      e.x += (ex / edist) * e.speed * dt;
      e.y += (ey / edist) * e.speed * dt;
      e.animTimer += dt;
      if (e.hitFlash > 0) e.hitFlash -= dt;

      // enemy vs player contact
      if (edist < PLAYER_RADIUS + ENEMY_RADIUS && player.invulnTimer <= 0) {
        player.health -= ENEMY_DAMAGE;
        player.invulnTimer = ENEMY_CONTACT_COOLDOWN;
        player.hitFlash = 0.3;
        updateHud();
        if (player.health <= 0) {
          player.health = 0;
          updateHud();
          triggerGameOver();
          return;
        }
      }
    }

    // --- bullet vs enemy collisions ---
    for (var bi = bullets.length - 1; bi >= 0; bi--) {
      var bl = bullets[bi];
      for (var ei = enemies.length - 1; ei >= 0; ei--) {
        var en = enemies[ei];
        var ddx = bl.x - en.x, ddy = bl.y - en.y;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dist < ENEMY_RADIUS + BULLET_RADIUS) {
          en.health -= BULLET_DAMAGE;
          en.hitFlash = 0.15;
          bullets.splice(bi, 1);
          if (en.health <= 0) {
            enemies.splice(ei, 1);
            score += 10;
            updateHud();
          }
          break;
        }
      }
    }
  }

  // ---------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------
  function drawBackground() {
    ctx.fillStyle = "#10151a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var grid = 48;
    ctx.strokeStyle = "rgba(255,255,255,0.045)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x < canvas.width; x += grid) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, canvas.height);
    }
    for (var y = 0; y < canvas.height; y += grid) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(canvas.width, y + 0.5);
    }
    ctx.stroke();
  }

  function drawBullets() {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.beginPath();
      ctx.fillStyle = "#fff3b0";
      ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = "#f4d35e";
      ctx.arc(b.x, b.y, BULLET_RADIUS * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render() {
    drawBackground();
    drawBullets();

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      var frame = Math.floor(e.animTimer * 4) % enemySheet.frameCount;
      drawSprite(enemySheet, frame, e.x, e.y, e.angle, ENEMY_RADIUS * 2.4, e.hitFlash);
    }

    var pFrame = player.moving ? Math.floor(player.animTimer * 8) % playerSheet.frameCount : 0;
    ctx.save();
    if (player.invulnTimer > 0) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(player.hitFlash * 50);
    }
    drawSprite(playerSheet, pFrame, player.x, player.y, player.aimAngle, PLAYER_RADIUS * 2.4, 0);
    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------
  var lastTime = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // fade hint after a few seconds
  setTimeout(function () {
    var hint = document.getElementById("hint");
    if (hint) hint.style.opacity = "0";
  }, 4500);

  document.getElementById("restart-btn").addEventListener("click", function () {
    resetGame();
  });

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
